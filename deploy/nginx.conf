server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Grant IDs are bearer capabilities; never write their URL paths to access logs.
  location /api/v1/playback/grants/ {
    access_log off;
    error_log /dev/null;
    proxy_pass http://server:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://server:4400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Quality discovery has one fixed 110-second budget for its two model steps.
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
