name: streamer-ai

services:
  data-init:
    build:
      context: .
      dockerfile: Dockerfile.server
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    # Existing volumes retain their original ownership across image rebuilds.
    # Do not follow links from server-managed data to other container paths.
    command:
      - >-
        test ! -L /app/data &&
        chown -R -P --no-dereference node:node /app/data &&
        chmod u+rwx /app/data
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - streamerai_data:/app/data
    healthcheck:
      disable: true

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      STREAMERAI_LOG_LEVEL: ${STREAMERAI_LOG_LEVEL:-info}
      STREAMERAI_HOST: 0.0.0.0
      STREAMERAI_ACCOUNT_SERVICE_URL: ${STREAMERAI_ACCOUNT_SERVICE_URL:-}
      STREAMERAI_ACCESS_MODE: ${STREAMERAI_ACCESS_MODE:-paired}
      STREAMERAI_WEB_ORIGIN: ${STREAMERAI_WEB_ORIGIN:-http://localhost:8080}
      STREAMERAI_ADVERTISE_URL: ${STREAMERAI_ADVERTISE_URL:-}
      STREAMERAI_DISCOVERY_ENABLED: ${STREAMERAI_DISCOVERY_ENABLED:-true}
      STREAMERAI_PORT: 4400
      STREAMERAI_DATA_DIR: /app/data
      STREAMERAI_SECRET_BACKEND: encrypted-file
      STREAMERAI_SECRET_KEY_FILE: /run/secrets/streamerai_master_key
      STREAMERAI_SECRET_VAULT_FILE: /app/data/secrets.vault
      INFERENCE_PROVIDER: ollama
      INFERENCE_BASE_URL: http://host.docker.internal:11434
      INFERENCE_MODEL: qwen3.5:4b
      INFERENCE_CONTEXT_TOKENS: 4096
      INFERENCE_MAX_OUTPUT_TOKENS: 512
      INFERENCE_TIMEOUT_MS: 60000
      OLLAMA_MINIMUM_VERSION: 0.5.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - streamerai_master_key
    volumes:
      - streamerai_data:/app/data
    ports:
      - "47777:47777/udp"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4400/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${STREAMERAI_WEB_BIND:-0.0.0.0}:8080:8080"

secrets:
  streamerai_master_key:
    file: ./.secrets/streamerai_master_key

volumes:
  streamerai_data:
