name: Release candidate artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

# Review artifacts only. Publishing, binary downloads, and signing are separate gates.
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install locked build tooling
        run: npm install --global pnpm@10.17.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify candidate
        run: pnpm check
      - name: Verify packaging and update checks
        run: pnpm distribution:test
      - name: Produce portable runtime prototype
        run: pnpm distribution:bundle --runtime-only --archive
      - name: Preserve candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-runtime-${{ runner.os }}-x64
          path: |
            dist/distribution/*.zip
            dist/distribution/*.tar.gz
            dist/distribution/*.sha256
          if-no-files-found: error
