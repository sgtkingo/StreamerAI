name: Release candidate artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

# Review artifacts only. Publishing, binary downloads, and signing are separate gates.
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Install locked build tooling
        run: npm install --global pnpm@10.17.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify candidate
        run: pnpm check
      - name: Verify packaging and update checks
        run: pnpm distribution:test
      - name: Produce portable runtime prototype
        run: pnpm distribution:bundle --runtime-only --archive
      - name: Preserve candidate for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-runtime-${{ runner.os }}-x64
          path: |
            dist/distribution/*.zip
            dist/distribution/*.tar.gz
            dist/distribution/*.sha256
          if-no-files-found: error
