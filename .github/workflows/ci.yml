name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.17.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm check

      - name: Verify portable runtime and signed-update staging
        run: pnpm distribution:test

      - name: Build runtime prototype archive
        run: pnpm distribution:bundle --runtime-only --archive

      - name: Preserve platform runtime prototype
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-prototype-${{ runner.os }}-x64
          path: |
            dist/distribution/*.zip
            dist/distribution/*.tar.gz
            dist/distribution/*.sha256
          if-no-files-found: error
